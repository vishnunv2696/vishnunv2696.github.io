<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d" />
      <stop offset="100%" stop-color="#09090d" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="#8b5cf6" stroke-width="2" />
  <!-- Globe / Spatial grid wireframe -->
  <circle cx="32" cy="32" r="20" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" fill="none" />
  <ellipse cx="32" cy="32" rx="10" ry="20" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" fill="none" />
  <line x1="12" y1="32" x2="52" y2="32" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
  <line x1="32" y1="12" x2="32" y2="52" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
  <!-- VN Monogram badge -->
  <rect x="18" y="20" width="28" height="24" rx="8" fill="url(#vn-grad)" opacity="0.9" />
  <text x="32" y="37" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">VN</text>
</svg>
